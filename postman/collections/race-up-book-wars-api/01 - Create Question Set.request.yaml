$kind: http-request
url: "{{baseUrl}}/question-sets"
method: POST
headers:
  X-Demo-User: "{{host}}"
body:
  type: json
  content: |-
    {
      "title": "Library Rules Quiz",
      "description": "Temporary question set used by the Postman run.",
      "subject": "Library Science",
      "grade_level": "College"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 201", function () {
        pm.response.to.have.status(201);
      });

      pm.test("the new set has an id", function () {
        pm.expect(pm.response.json().question_set.set_id).to.be.a("number");
      });

      // the requests that follow use this id
      pm.collectionVariables.set("setId", pm.response.json().question_set.set_id);
    language: text/javascript
order: 1000
