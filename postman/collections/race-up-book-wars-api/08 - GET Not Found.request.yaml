$kind: http-request
url: "{{baseUrl}}/question-sets/999999"
method: GET
headers:
  X-Demo-User: "{{host}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 404", function () {
        pm.response.to.have.status(404);
      });

      pm.test("error code is QUESTION_SET_NOT_FOUND", function () {
        pm.expect(pm.response.json().error.code).to.eql("QUESTION_SET_NOT_FOUND");
      });
    language: text/javascript
order: 8000
