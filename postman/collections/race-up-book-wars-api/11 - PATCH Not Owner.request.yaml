$kind: http-request
url: "{{baseUrl}}/question-sets/{{setId}}"
method: PATCH
headers:
  X-Demo-User: "{{otherHost}}"
body:
  type: json
  content: |-
    {
      "title": "Updated by the other host"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 403", function () {
        pm.response.to.have.status(403);
      });

      pm.test("error code is FORBIDDEN", function () {
        pm.expect(pm.response.json().error.code).to.eql("FORBIDDEN");
      });
    language: text/javascript
order: 11000
