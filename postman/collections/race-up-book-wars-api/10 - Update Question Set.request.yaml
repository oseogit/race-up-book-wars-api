$kind: http-request
url: "{{baseUrl}}/question-sets/{{setId}}"
method: PATCH
headers:
  X-Demo-User: "{{host}}"
body:
  type: json
  content: |-
    {
      "title": "Library Rules Quiz Updated"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("title changed, other fields kept", function () {
        const set = pm.response.json().question_set;
        pm.expect(set.title).to.eql("Library Rules Quiz Updated");
        pm.expect(set.subject).to.eql("Library Science");
      });
    language: text/javascript
order: 10000
