$kind: http-request
url: "{{baseUrl}}/question-sets/abc"
method: GET
headers:
  X-Demo-User: "{{host}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("status is 400", function () {
        pm.response.to.have.status(400);
      });

      pm.test("error code is VALIDATION_FAILED", function () {
        pm.expect(pm.response.json().error.code).to.eql("VALIDATION_FAILED");
      });
    language: text/javascript
order: 9000
